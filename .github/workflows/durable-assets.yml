name: Durable Assets

on:
  push:
    branches: [main, feat/durable-asset-promotion-v1]
    paths:
      - "packages/durable-assets/**"
      - "packages/durable-assets-aws-kms/**"
      - ".github/workflows/durable-assets.yml"
      - "AGENTS.md"
  pull_request:
    paths:
      - "packages/durable-assets/**"
      - "packages/durable-assets-aws-kms/**"
      - ".github/workflows/durable-assets.yml"
      - "AGENTS.md"
  workflow_dispatch:
    inputs:
      confirm_repository_sha:
        description: "Exact 40-character main SHA approved for credentialed live-provider execution"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-core:
    runs-on: ubuntu-latest
    env:
      CONFORMANCE_REPOSITORY_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        working-directory: packages/durable-assets
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify executed checkout matches claimed source revision
        run: test "$(git rev-parse HEAD)" = "$CONFORMANCE_REPOSITORY_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/durable-assets/package.json
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - name: Preserve behavior conformance receipt
        uses: actions/upload-artifact@v4
        with:
          name: agent-behavior-conformance-receipt
          path: packages/durable-assets/artifacts/behavior/verification-before-completion-sandbox-receipt.json
          if-no-files-found: error
          retention-days: 90

  verify-aws-kms:
    runs-on: ubuntu-latest
    env:
      CONFORMANCE_REPOSITORY_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        working-directory: packages/durable-assets-aws-kms
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify executed checkout matches claimed source revision
        run: test "$(git rev-parse HEAD)" = "$CONFORMANCE_REPOSITORY_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/durable-assets-aws-kms/package.json
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run check

  live-provider-contract:
    if: github.event_name == 'pull_request'
    needs: [verify-core, verify-aws-kms]
    runs-on: ubuntu-latest
    env:
      CONFORMANCE_REPOSITORY_SHA: ${{ github.event.pull_request.head.sha }}
    defaults:
      run:
        working-directory: packages/durable-assets
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify executed checkout matches claimed source revision
        run: test "$(git rev-parse HEAD)" = "$CONFORMANCE_REPOSITORY_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/durable-assets/package.json
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Execute uncredentialed live provider contract
        run: npm run live:conformance
      - name: Preserve uncredentialed live behavior receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-agent-behavior-contract-receipt
          path: packages/durable-assets/artifacts/live-agent-behavior-conformance-receipt.json
          if-no-files-found: error
          retention-days: 90

  authorize-live-provider-conformance:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Authorize exact main revision
        env:
          ACTOR: ${{ github.actor }}
          ACTUAL_SHA: ${{ github.sha }}
          CONFIRMED_SHA: ${{ inputs.confirm_repository_sha }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$ACTOR" = "Krosebrook" || { echo "Unauthorized actor: $ACTOR" >&2; exit 1; }
          test "$DISPATCH_REF" = "refs/heads/main" || { echo "Credentialed conformance must dispatch from main." >&2; exit 1; }
          echo "$CONFIRMED_SHA" | grep -Eq '^[a-f0-9]{40}$' || { echo "confirm_repository_sha must be a full 40-character lowercase Git SHA." >&2; exit 1; }
          test "$CONFIRMED_SHA" = "$ACTUAL_SHA" || { echo "Confirmed SHA does not match the checked-out main revision." >&2; exit 1; }
          echo "Authorized credentialed conformance for $ACTUAL_SHA"

  live-provider-conformance:
    if: github.event_name == 'workflow_dispatch'
    needs: [verify-core, verify-aws-kms, authorize-live-provider-conformance]
    runs-on: ubuntu-latest
    env:
      CONFORMANCE_REPOSITORY_SHA: ${{ github.sha }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
    defaults:
      run:
        working-directory: packages/durable-assets
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify executed checkout matches claimed source revision
        run: test "$(git rev-parse HEAD)" = "$CONFORMANCE_REPOSITORY_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/durable-assets/package.json
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Execute credentialed live provider conformance
        run: npm run live:conformance
      - name: Preserve live behavior conformance receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-agent-behavior-conformance-receipt
          path: packages/durable-assets/artifacts/live-agent-behavior-conformance-receipt.json
          if-no-files-found: error
          retention-days: 90
